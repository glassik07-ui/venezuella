<style>
  :root {
    --bg: #070b09;
    --accent: #4ade80;
    --purple: #a855f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Chakra Petch', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .display { font-family: 'Russo One', system-ui, sans-serif; letter-spacing: .04em; }

  /* ── Фон ── */
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bgfx::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 45% at 50% -5%, rgba(74,222,128,.16), transparent 65%);
  }
  .bgfx::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 45% 35% at 85% 100%, rgba(168,85,247,.12), transparent 60%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 35%, #000, transparent);
    mask-image: radial-gradient(ellipse 75% 60% at 50% 35%, #000, transparent);
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 448px; margin: 0 auto;
    padding: 48px 20px calc(40px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 28px;
    min-height: 100vh;
  }

  /* ── Анимация появления ── */
  .anim { opacity: 0; animation: rise .55s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  /* ── Профиль ── */
  header { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .avatar-box { position: relative; width: 96px; height: 96px; }
  .avatar-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    background: conic-gradient(from 120deg, #4ade80, #a855f7, #4ade80);
    filter: blur(10px); opacity: .6; animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .28; } }
  .avatar {
    position: relative; width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; border: 2px solid rgba(110,231,183,.6);
    box-shadow: 0 0 35px rgba(74,222,128,.35);
  }
  h1 {
    margin-top: 20px; font-size: 24px; line-height: 1.2;
    text-shadow: 0 0 18px rgba(74,222,128,.35);
  }
  .bio { margin-top: 12px; max-width: 340px; font-size: 14px; line-height: 1.65; color: rgba(255,255,255,.55); }

  .socials { margin-top: 20px; display: flex; gap: 12px; }
  .socials a {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.65); text-decoration: none;
    transition: all .2s;
  }
  .socials a:hover {
    transform: translateY(-2px); border-color: rgba(52,211,153,.5);
    color: #6ee7b7; box-shadow: 0 0 20px rgba(74,222,128,.3);
  }

  /* ── Заголовок секции ── */
  .sec-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .sec-head svg { color: #6ee7b7; flex: none; }
  .sec-head span { font-size: 12px; letter-spacing: .3em; color: rgba(255,255,255,.5); }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, rgba(52,211,153,.4), transparent); }

  section.games { display: flex; flex-direction: column; gap: 16px; }

  /* ── Карточка игры ── */
  .card {
    display: block; text-decoration: none; color: #fff;
    border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    transition: transform .25s, border-color .25s;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(52,211,153,.5); }
  .cover { position: relative; aspect-ratio: 16/9; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
  .card:hover .cover img { transform: scale(1.06); }
  .cover-fade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.1) 45%, transparent); }
  .play {
    position: absolute; right: 12px; bottom: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to bottom right, #34d399, #22c55e);
    box-shadow: 0 0 25px rgba(74,222,128,.55);
    transition: transform .3s;
  }
  .play svg { margin-left: 1px; }
  .card:hover .play { transform: scale(1.1); }
  .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  .card-bottom h3 { font-size: 16px; font-weight: 400; }
  .jugar {
    display: flex; align-items: center; gap: 2px; flex: none;
    font-size: 11px; font-weight: 600; letter-spacing: .12em;
    color: rgba(110,231,183,.8); text-transform: uppercase;
  }
  .card:hover .jugar { color: #6ee7b7; }

  /* ── Telegram CTA ── */
  .tg-cta {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    border-radius: 16px; padding: 16px 24px; text-decoration: none;
    background: linear-gradient(to right, #10b981, #4ade80, #a3e635);
